<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- ARTIFACT:START -->
<title>Lightech Mentoring App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css">
<!-- ARTIFACT:HEAD-END -->
</head>
<body>
<div id="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo" id="brand-logo">L</div>
        <div style="min-width:0">
          <div class="brand-name ellipsis" id="brand-name">Lightech Mentoring App</div>
          <div class="brand-tag ellipsis" id="brand-tag"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="sync local" id="sync"><span class="dot"></span><span id="sync-text"></span></span>
        <button class="btn btn-bar" id="console-back" type="button" hidden></button>
        <button class="btn btn-gold" id="btn-add-lead" type="button">+ <span id="btn-add-lead-label">Lead</span></button>
        <button class="btn btn-bar" id="btn-add-session" type="button">+ <span id="btn-add-session-label">Session</span></button>
        <div class="me-chip" id="me-chip"></div>
        <div class="lang-seg" id="lang-bar" role="group" aria-label="Language"></div>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Main menu"></nav>
  </header>
  <div class="imp-banner" id="imp-banner" hidden></div>

  <main id="view" class="container"></main>
</div>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-backdrop" data-close-drawer></div>
  <div class="drawer-panel" id="drawer-panel"></div>
</aside>

<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="icon-btn" type="button" data-close-modal aria-label="Close">✕</button>
    </div>
    <form id="modal-form" class="modal-body" autocomplete="off"></form>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="assets/config.js"></script>
<script src="assets/presets.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
